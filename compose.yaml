name: wireguard

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules:ro

    ports:
      - "${WG_SERVERPORT}:51820/udp"

    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Seoul}

      # Server public IP or domain (required)
      - SERVERURL=${WG_SERVERURL}
      - SERVERPORT=${WG_SERVERPORT}

      # Initial number of peers to create
      - PEERS=${WG_PEERS}

      # DNS for peers (important for iOS)
      - PEERDNS=${WG_PEERDNS}

      # WireGuard internal subnet
      - INTERNAL_SUBNET=${WG_INTERNAL_SUBNET}

      # Full tunnel / Split tunnel
      - ALLOWEDIPS=${WG_ALLOWEDIPS}

      # Persistent keepalive for NAT stability (mobile recommended)
      - PERSISTENTKEEPALIVE_PEERS=${WG_KEEPALIVE}

    healthcheck:
      test: ["CMD", "wg", "show"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
